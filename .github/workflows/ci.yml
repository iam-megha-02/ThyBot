name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Dummy values so config.py's os.environ[...] lookups succeed at
  # import time. No real Groq/Postgres call happens in tests/ — every
  # LLM call is mocked, and DB tests use an in-memory SQLite fixture.
  GROQ_API_KEY: "ci-placeholder-not-a-real-key"
  DATABASE_URL: "sqlite:///:memory:"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: pytest tests/ -v
